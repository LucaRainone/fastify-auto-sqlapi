name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'
      - run: npm ci
      # Same gate the agent runs locally: check, build, dup, depcruise, knip, unit tests.
      # Integration tests need Docker (Postgres + MySQL) and stay a local/manual step.
      - run: npm run verify
